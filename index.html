<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FBF8F1">
  <meta name="description" content="StatLab - Independent Browser-Based Biostatistics Notebook Powered by Pure Base R in WebAssembly">
  
  <title>StatLab — Pure Base R Biostatistics Notebook</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./assets/logo.png">
  <link rel="apple-touch-icon" href="./assets/logo.png">
  
  <!-- Vendor Styles & Scripts (Relative URLs for GitHub Pages Compatibility) -->
  <link rel="stylesheet" href="./vendor/katex/katex.min.css">
  <link rel="stylesheet" href="./css/statlab.css">
  
  <script defer src="./vendor/katex/katex.min.js"></script>
  <script defer src="./vendor/pdfmake/pdfmake.min.js"></script>
  <script defer src="./vendor/pdfmake/vfs_fonts.js"></script>
</head>
<body class="sl-standalone">
  <div id="app"></div>

  <script type="module">
    import { mountStatLab } from "./js/app.js";

    // Mount StatLab Application
    window.addEventListener("DOMContentLoaded", async () => {
      const root = document.getElementById("app");
      await mountStatLab(root, {
        webrBaseUrl: "./vendor/webr/"
      });
    });

    // Register Service Worker for Offline PWA Capabilities
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch((err) => {
          console.warn("ServiceWorker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
